# docker-compose.yml — AI Portfolio Assistant
#
# Usage:
#   docker compose up --build
#   Open http://localhost:8080

services:
  assistant:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
